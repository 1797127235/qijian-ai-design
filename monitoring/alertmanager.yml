global:
  resolve_timeout: 5m

route:
  receiver: qijian-api
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: qijian-api
    webhook_configs:
      - url: http://host.docker.internal:8787/internal/monitoring/alerts
        send_resolved: true
