<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7A4A2A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- transparent canvas -->
  <g filter="url(#shadow)">
    <rect x="28" y="18" width="200" height="212" rx="44"
          fill="#FFFDF7" stroke="#B96E3F" stroke-width="5"/>
  </g>

  <!-- faint architectural grid -->
  <g stroke="#E7D8C8" stroke-width="1.6" opacity="0.9">
    <line x1="95" y1="42" x2="95" y2="162"/>
    <line x1="126" y1="42" x2="126" y2="162"/>
    <line x1="157" y1="42" x2="157" y2="162"/>
    <line x1="188" y1="42" x2="188" y2="162"/>
    <line x1="84" y1="64" x2="198" y2="64"/>
    <line x1="84" y1="94" x2="198" y2="94"/>
    <line x1="84" y1="124" x2="198" y2="124"/>
    <line x1="84" y1="154" x2="198" y2="154"/>
  </g>

  <!-- compass -->
  <g fill="none" stroke="#B96E3F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="79" cy="73" r="12"/>
    <line x1="72" y1="86" x2="58" y2="153"/>
    <line x1="86" y1="86" x2="102" y2="153"/>
    <line x1="64" y1="109" x2="94" y2="109"/>
    <line x1="80" y1="97" x2="80" y2="119"/>
  </g>
  <rect x="76" y="48" width="6" height="12" rx="2" fill="#B96E3F"/>

  <!-- building outline -->
  <g fill="none" stroke="#B96E3F" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
    <!-- tall left volume -->
    <path d="M111 159 V82 L151 62 V159"/>
    <path d="M111 95 L151 75"/>
    <!-- right volume -->
    <path d="M151 91 L191 109 V159 H151"/>
    <path d="M151 122 H191"/>
    <path d="M171 99 V159"/>
    <!-- ground/base line -->
    <path d="M102 159 H196"/>
    <!-- small door -->
    <path d="M178 159 V143 H190 V159"/>
  </g>

  <!-- ruler -->
  <g fill="none" stroke="#B96E3F" stroke-width="5" stroke-linecap="square">
    <rect x="53" y="170" width="145" height="28" rx="1"/>
  </g>
  <g stroke="#B96E3F" stroke-width="3">
    <line x1="61" y1="170" x2="61" y2="182"/>
    <line x1="71" y1="170" x2="71" y2="179"/>
    <line x1="81" y1="170" x2="81" y2="182"/>
    <line x1="91" y1="170" x2="91" y2="179"/>
    <line x1="101" y1="170" x2="101" y2="182"/>
    <line x1="111" y1="170" x2="111" y2="179"/>
    <line x1="121" y1="170" x2="121" y2="182"/>
    <line x1="131" y1="170" x2="131" y2="179"/>
    <line x1="141" y1="170" x2="141" y2="182"/>
    <line x1="151" y1="170" x2="151" y2="179"/>
    <line x1="161" y1="170" x2="161" y2="182"/>
    <line x1="171" y1="170" x2="171" y2="179"/>
    <line x1="181" y1="170" x2="181" y2="182"/>
    <line x1="191" y1="170" x2="191" y2="179"/>
  </g>
</svg>
